services:
  db:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  ollama:
    build: .
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nextjs:
    build:
      context: ..
      dockerfile: dev-env/Dockerfile.next
    env_file:
      - ../.env
    ports:
      - "${NEXTJS_PORT}:3000"
    depends_on:
      - db
      - ollama
    networks:
      - app-network
volumes:
  pg_data:
  ollama_data:

networks:
  app-network:
    driver: bridge
